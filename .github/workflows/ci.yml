name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  # CI standard: the local check output must be attached for this commit.
  gate:
    uses: ./.github/workflows/pr-ready.yml
    with:
      mode: gate
    # A call must grant everything any job in the shared file asks for;
    # the gate job itself only takes pull-requests: read.
    permissions:
      actions: read
      contents: write
      pull-requests: write

  # CI standard: a failed ready run returns the pull request to draft with a comment.
  failure-loop:
    needs: [ci, gate]
    if: ${{ failure() && github.event_name == 'pull_request' }}
    uses: ./.github/workflows/pr-ready.yml
    with:
      mode: failure-loop
    permissions:
      actions: read
      contents: write
      pull-requests: write
